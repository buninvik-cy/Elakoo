# nginx site for elakoo.com - installed by deploy/server-setup.sh
# Static site in /var/www/elakoo/site, contact form proxied to the local Node server.

limit_req_zone $binary_remote_addr zone=elakoo_contact:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name elakoo.com www.elakoo.com;

    root /var/www/elakoo/site;
    index index.html;
    charset utf-8;

    # www -> apex (certbot keeps this working after it adds HTTPS)
    if ($host = www.elakoo.com) { return 301 $scheme://elakoo.com$request_uri; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://i.ytimg.com data:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/contact {
        limit_req zone=elakoo_contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
}

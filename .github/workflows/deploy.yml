name: Deploy to server

# Builds the site and copies it to the server over SSH.
# Runs on every push to main, by hand, and after each YouTube sync that changed the catalog.
# Secrets: SERVER_HOST, SERVER_SSH_KEY (printed once by "Server setup"),
#          RESEND_API_KEY, CONTACT_TO_EMAIL, CONTACT_FROM_EMAIL (contact form; optional until ready).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SERVER_HOST:
        required: false
      SERVER_SSH_KEY:
        required: false
      RESEND_API_KEY:
        required: false
      CONTACT_TO_EMAIL:
        required: false
      CONTACT_FROM_EMAIL:
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check server secrets
        id: check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::warning::SERVER_HOST / SERVER_SSH_KEY not set yet - site built but not deployed. Run 'Server setup' first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH key
        if: steps.check.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload site and contact server
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "$SSH" dist/ deploy@"$HOST":/var/www/elakoo/site/
          rsync -az --delete -e "$SSH" server/ deploy@"$HOST":/opt/elakoo/server/
          rsync -az --delete -e "$SSH" functions/ deploy@"$HOST":/opt/elakoo/functions/
          rsync -az -e "$SSH" package.json deploy@"$HOST":/opt/elakoo/package.json
      - name: Contact form settings and restart
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
        run: |
          FROM="${CONTACT_FROM_EMAIL:-Elakoo website <no-reply@elakoo.com>}"
          printf 'PORT=8787\nHOST=127.0.0.1\nSITE_ORIGIN=https://elakoo.com\nRESEND_API_KEY=%s\nCONTACT_TO_EMAIL=%s\nCONTACT_FROM_EMAIL=%s\n' \
            "$RESEND_API_KEY" "$CONTACT_TO_EMAIL" "$FROM" > /tmp/contact.env
          SSH="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes"
          scp -i ~/.ssh/deploy -o StrictHostKeyChecking=yes /tmp/contact.env deploy@"$HOST":/etc/elakoo/contact.env
          rm -f /tmp/contact.env
          $SSH deploy@"$HOST" "chmod 600 /etc/elakoo/contact.env && sudo systemctl restart elakoo-contact"
      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          curl -fsS -o /dev/null -w "home: %{http_code}\n" -H "Host: elakoo.com" "http://$HOST/" || true
          ssh -i ~/.ssh/deploy deploy@"$HOST" "curl -fsS http://127.0.0.1:8787/api/health && echo ' contact server ok'"
